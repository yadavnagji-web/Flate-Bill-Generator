<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Apartment / Building Blueprint Lines in Background -->
  <path d="M120 380 V 220 L 256 120 L 392 220 V 380 Z" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Sub-meter / Flat Divisions -->
  <line x1="180" y1="260" x2="230" y2="260" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="300" x2="230" y2="300" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="340" x2="230" y2="340" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />

  <line x1="282" y1="260" x2="332" y2="260" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
  <line x1="282" y1="300" x2="332" y2="300" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
  <line x1="282" y1="340" x2="332" y2="340" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />

  <!-- Dynamic Energy Glow -->
  <circle cx="256" cy="270" r="110" fill="#f59e0b" opacity="0.15" />

  <!-- Hero Electric Lightning Bolt -->
  <path d="M280 140 L 190 280 H 260 L 232 400 L 340 250 H 270 Z" 
        fill="url(#boltGrad)" 
        stroke="#d97706" 
        stroke-width="6" 
        stroke-linejoin="round" 
        filter="drop-shadow(0px 8px 16px rgba(245, 158, 11, 0.4))" />

  <!-- Rupee Symbol Badge at Bottom Right -->
  <g transform="translate(330, 330)">
    <circle cx="50" cy="50" r="46" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="4" />
    <text x="50" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
  </g>
</svg>
